name: Synthetic contract and browser acceptance
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test
      - run: npm run build && npm run build:plugin
      - run: npm run test:packed
      - run: google-chrome --version
      - run: npm run test:browser
      - name: Record standalone synthetic showcase
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          npx --no-install playwright install ffmpeg
          npm run dev -- --port 4173 --strictPort > /tmp/dsh-a2ui-showcase-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          timeout 180s node scripts/record-showcase.mjs
      - name: Preserve only reviewed synthetic video and receipt
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-a2ui-synthetic-showcase-${{ github.sha }}
          path: |
            showcase-video/dsh-a2ui-synthetic-demo.webm
            showcase-video/receipt.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
